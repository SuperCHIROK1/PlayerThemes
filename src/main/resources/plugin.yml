name: PlayerThemes
version: '${project.version}'
main: io.inf8ty.playerthemes.PlayerThemes
api-version: '1.16'
prefix: PlayerThemes
depend: [PlaceholderAPI]
authors: [SuperCHIROK1]
description: Allow players to customize their themes

libraries:
  - "com.zaxxer:HikariCP:5.1.0"
  - "redis.clients:jedis:7.2.0"

commands:
  playerthemes:
    aliases:
      - pth
    permission: "playerthemes.admin"

permissions:
  playerthemes.admin:
    description: Reload plugin
  playerthemes.install:
    description: Install theme
  playerthemes.install.other:
    description: Install theme for other players
  playerthemes.cooldown.bypass:
    description: Bypass commands cooldown
  playerthemes.notify:
    description: Notify plugin updates